<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>潛水員 Diver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>潛水員 Diver</h1>
      <canvas id="gameCanvas" width="960" height="540" aria-label="Diver game canvas"></canvas>
      <section class="hud" aria-live="polite">
        <div><strong>分數</strong>: <span id="score">0</span></div>
        <div><strong>氧氣</strong>: <span id="oxygen">10.0</span>/10</div>
        <div id="warning" role="status"></div>
      </section>
      <p class="hint">操作：WASD 或方向鍵移動，按 R 重置。</p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
